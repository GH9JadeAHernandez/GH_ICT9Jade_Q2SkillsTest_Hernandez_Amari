<div class="container mt-5">
    <div class="row justify-content-center">
        <h1 class=".text-black text-center">OBMC Student Enrollment</h1>
    </div>
</div>

<div class="container mt-5">
    <div class="row justify-content-center">
    <div class="col-md-8">
    <form class="text-center bg-white rounded p-5">
        <h4 class="bg-white text-center rounded">Student Information</h4>
        <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="firstName" class="form-control" placeholder="Enter first name" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" name="lastName" class="form-control"placeholder="Enter last name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" placeholder="Last Name...">
        </div>
        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select class="form-control" placeholder="Gender">
                <option>Male</option>
                <option>Female</option>
                <option>Non Binary</option>
                <option>Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Grade Level</label>
            <select class="form-control" placeholder="Gender">
                <option>Junior Casa</option>
                <option>Junior Advanced Casa</option>
                <option>Casa</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
                <input type="Email" class="form-control" placeholder="john/janedoe@gmail.com......."> 
        </div>
        <div class="mb-3">
            <label class="form-label">Mothers Name</label>
                <input type="text" class="form-control" placeholder="Jane Doe......."> 
        </div>
        <div class="mb-3">
            <label class="form-label">Fathers Name</label>
                <input type="text" class="form-control" placeholder="John Doe......."> 
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
                <input type="text" class="form-control" placeholder="0123456789"> 
        </div>
        <div class="mb-4">
            <label class="form-label">Mode of Learning</label>

            <div class="learning-mode">
                <div class="form-check">
                    <input type="radio" name="learningMode" value="On-site" class="form-check-input" required>
                    <label class="form-check-label">On-site</label>
                </div>

                <div class="form-check">
                        <input type="radio" name="learningMode"value="Online" class="form-check-input">
                        <label class="form-check-label">Online</label>
                </div>

                <div class="form-check">
                     <input type="radio" name="learningMode" value="Asynchronous" class="form-check-input">
                    <label class="form-check-label">Asynchronous</label>
                    </div>
                </div>
            </div>
        <div class="mb-3">
            <input type="checkbox" id="agree" name="agree" value="yes" checked>
            <label for="subscribe">I confirm that the information i provided is true and complete</label>  
        </div>        
        <div class="mb-3">
            <label class="form-label">Message</label>
                <input type="text" class="form-control" placeholder="Type here......" style="height: 140px;"> 
        </div>
        <input type="submit" class="btn btn-primary">
    </form>
    </div>
    </div>
    </div>
</div>
    
</body>
